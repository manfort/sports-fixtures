name: Update fixtures

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: update-fixtures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon
      - run: python fetch.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          # Time zone of the times in the posts
          SOURCE_TZ: "America/New_York"
      - run: |
          git config user.name "fixtures-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures.json
          git diff --cached --quiet || (git commit -m "Update fixtures" && git push)
